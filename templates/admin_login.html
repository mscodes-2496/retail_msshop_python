<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title><link rel="stylesheet" href="/static/css/admin.css?v=100"></head><body class="login-page"><main class="login"><div class="brand-mark">🛒</div><h1>Shop Admin</h1><p>Sign in with the owner account created in Supabase Authentication.</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post"><label>Email<input type="email" name="email" autocomplete="username" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button class="primary full" type="submit">Sign in</button></form></main></body></html>
