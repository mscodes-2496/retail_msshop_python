<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop Settings</title><link rel="stylesheet" href="/static/css/admin.css?v=100"></head><body>{% set active="settings" %}<nav class="admin-nav"><div class="admin-nav-inner"><a class="admin-brand" href="/admin/orders"><span class="brand-mark">🛒</span>Store Admin</a><div class="admin-links"><a href="/admin/orders" class="{{ 'active' if active=='orders' else '' }}">Orders</a><a href="/admin/catalogue" class="{{ 'active' if active=='catalogue' else '' }}">Catalogue</a><a href="/admin/settings" class="{{ 'active' if active=='settings' else '' }}">Settings</a><a href="/" target="_blank">Store</a><a href="/admin/logout" class="logout">Logout</a></div></div></nav>{% set active="settings" %}<main class="container narrow"><div class="page-title"><h1>Shop settings</h1><span>Store configuration</span></div><section class="panel"><h2>Store information</h2><form method="post" action="/admin/settings" class="admin-form"><div class="form-grid"><div class="form-group"><label for="shop_name">Shop name</label><input id="shop_name" name="shop_name" value="{{ settings.shop_name or '' }}" required></div><div class="form-group"><label for="whatsapp_number">WhatsApp number</label><input id="whatsapp_number" name="whatsapp_number" value="{{ settings.whatsapp_number or '' }}" required><small>Country code + number, e.g. 919876543210</small></div><div class="form-group full"><label for="address">Shop address</label><textarea id="address" name="address">{{ settings.address or '' }}</textarea></div><div class="form-group"><label for="delivery_fee">Delivery fee</label><input id="delivery_fee" type="number" step=".01" min="0" name="delivery_fee" value="{{ settings.delivery_fee or 0 }}"></div><div class="form-group"><label for="min_order_free_delivery">Free delivery above</label><input id="min_order_free_delivery" type="number" step=".01" min="0" name="min_order_free_delivery" value="{{ settings.min_order_free_delivery or 0 }}"></div></div><div class="form-actions"><button class="primary" type="submit">Save settings</button><a class="secondary btn" href="/">View store</a></div></form></section></main></body></html>
