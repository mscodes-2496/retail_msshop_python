<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/static/css/style.css"><title>{{ title or "WhatsApp Ordering" }}</title></head><body><header class="admin-nav"><a href="/admin/orders">Orders</a><a href="/admin/catalogue">Catalogue</a><a href="/admin/settings">Settings</a><a href="/" target="_blank">Store</a><a href="/admin/logout">Logout</a></header>
<main class="container"><h1>Catalogue</h1><section class="panel"><h2>Add product</h2><form method="post" class="form-grid"><label>Name<input name="name" required></label><label>Category<input name="category" required></label><label>Price<input name="price" type="number" min="0" step=".01" required></label><label>Unit<input name="unit" required placeholder="kg / pack / litre"></label><label>Note<input name="note"></label><button class="primary">Add product</button></form></section>
<div class="table-wrap"><table><thead><tr><th>Name</th><th>Category</th><th>Price</th><th>Unit</th><th>Available</th><th>Actions</th></tr></thead><tbody>
{% for p in products %}<tr><td>{{p.name}}</td><td>{{p.category}}</td><td>₹{{"%.2f"|format(p.price|float)}}</td><td>{{p.unit}}</td><td>{{"Yes" if p.available else "No"}}</td><td class="actions">
<form method="post" action="/admin/catalogue/{{p.id}}/toggle"><input type="hidden" name="available" value="{{'false' if p.available else 'true'}}"><button class="secondary">{{"Disable" if p.available else "Enable"}}</button></form>
<form method="post" action="/admin/catalogue/{{p.id}}/delete" onsubmit="return confirm('Delete this product?')"><button class="danger">Delete</button></form></td></tr>{% endfor %}</tbody></table></div></main></body></html>
